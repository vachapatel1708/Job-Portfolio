{% extends "frontend/common/base.html" %}

{% block contain %}

    <main class="min-h-[calc(100vh-80px)] flex items-center justify-center px-6 py-12">

        <div class="w-full max-w-md">

            <div class="bg-white rounded-3xl border border-slate-200 shadow-xl p-8 md:p-10">

                <!-- HEADER -->

                <div class="text-center">
                    <div class="w-16 h-16 mx-auto bg-blue-50 rounded-2xl flex items-center justify-center text-3xl">
                        🔐
                    </div>
                    <h2 class="text-3xl font-extrabold text-slate-900 mt-5">
                        Welcome Back
                    </h2>
                    <p class="text-slate-500 mt-2">
                        Login to your CareerConnect account
                    </p>
                </div>

                <!-- ERROR -->

                {% if error %}
                    <div class="mt-6 p-3 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm">
                        {{ error }}
                    </div>
                {% endif %}

                <!-- LOGIN FORM -->

                <form class="mt-8 space-y-5" action="{% url 'login' %}" method="post" >

                    {% csrf_token %}

                    <!-- IMPORTANT: Keep next URL while submitting form -->

                    <input type="hidden" name="next" value="{{ request.GET.next }}">

                    <!-- USERNAME -->

                    <div>

                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            Username
                        </label>

                        <input type="text" name="username" placeholder="Enter your username" required class="w-full px-4 py-3.5 border border-slate-200 rounded-xl outline-none focus:border-blueMain focus:ring-2 focus:ring-blue-100 transition" >

                    </div>


                    <!-- PASSWORD -->

                    <div>

                        <div class="flex items-center justify-between mb-2">

                            <label class="text-sm font-semibold text-slate-700">
                                Password
                            </label>

                            <a href="forgot_password.html" class="text-sm text-blueMain font-semibold hover:underline">
                                Forgot Password?
                            </a>

                        </div>

                        <input type="password" name="password" placeholder="Enter your password" required class="w-full px-4 py-3.5 border border-slate-200 rounded-xl outline-none focus:border-blueMain focus:ring-2 focus:ring-blue-100 transition" >

                    </div>


                    <!-- REMEMBER ME -->

                    <div class="flex items-center gap-2">

                        <input type="checkbox" id="remember" name="remember" class="w-4 h-4 accent-blueMain">

                        <label for="remember" class="text-sm text-slate-500" >
                            Remember me
                        </label>

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button type="submit" class="w-full bg-blueMain hover:bg-blueDark text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-100" >
                        Login to Account →
                    </button>

                </form>


                <!-- REGISTER -->

                <div class="text-center mt-8 pt-6 border-t border-slate-100">

                    <p class="text-sm text-slate-500">

                        Don't have an account?

                        <a href="/register" class="text-blueMain font-bold hover:underline" >
                            Create Account
                        </a>

                    </p>

                </div>

            </div>


            <!-- SECURITY -->

            <p class="text-center text-xs text-slate-400 mt-6">
                🔒 Your information is securely protected
            </p>

        </div>

    </main>

{% endblock contain %}
